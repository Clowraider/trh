{% extends "base.html" %}

{% block title %}Nuevo usuario - TRH{% endblock %}

{% block content %}
<h1 class="h3 mb-4">Nuevo usuario</h1>

<div class="card shadow-sm">
  <div class="card-body">
    <form method="post" action="{{ url_for('admin.new_user') }}">
      <input type="hidden" name="csrf_token" value="{{ g.current_user.csrf_token }}">

      <div class="row g-3">
        <div class="col-md-6">
          <label for="usuario" class="form-label">Usuario</label>
          <input type="text" class="form-control" id="usuario" name="usuario" value="{{ usuario or '' }}" required>
        </div>
        <div class="col-md-6">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required>
        </div>
        <div class="col-md-6">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" class="form-control" id="nombre" name="nombre" value="{{ nombre or '' }}" required>
        </div>
        <div class="col-md-6">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" name="password" required minlength="8">
        </div>
        <div class="col-md-4">
          <label for="ciudad" class="form-label">Ciudad</label>
          <input type="text" class="form-control" id="ciudad" name="ciudad" value="{{ ciudad or '' }}">
        </div>
        <div class="col-md-4">
          <label for="provincia" class="form-label">Provincia</label>
          <input type="text" class="form-control" id="provincia" name="provincia" value="{{ provincia or '' }}">
        </div>
        <div class="col-md-4">
          <label for="pais" class="form-label">País</label>
          <input type="text" class="form-control" id="pais" name="pais" value="{{ pais or '' }}">
        </div>
        <div class="col-12">
          <label for="notas" class="form-label">Notas</label>
          <textarea class="form-control" id="notas" name="notas" rows="3" maxlength="2000">{{ notas or '' }}</textarea>
        </div>
        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="is_admin" name="is_admin" value="1" {% if is_admin %}checked{% endif %}>
            <label class="form-check-label" for="is_admin">Administrador</label>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-between mt-4">
        <a href="{{ url_for('admin.list_users_view') }}" class="btn btn-outline-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary">Crear usuario</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
